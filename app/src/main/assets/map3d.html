<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="/web/maplibre-gl.css" />
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101713;
      touch-action: none;
    }
    .maplibregl-canvas { outline: none; }
    .user-marker {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      box-sizing: border-box;
      background: #23d291;
      border: 4px solid #ffffff;
      box-shadow: 0 1px 6px rgba(0,0,0,.75);
    }
    .waypoint-marker {
      min-width: 34px;
      height: 34px;
      padding: 0 4px;
      border-radius: 17px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18,28,22,.92);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 7px rgba(0,0,0,.8);
      color: white;
      font-size: 22px;
      line-height: 30px;
      user-select: none;
      -webkit-user-select: none;
    }
    .maplibregl-ctrl-attrib {
      font-size: 9px !important;
      background: rgba(255,255,255,.72) !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="/web/maplibre-gl.js"></script>
  <script>
    'use strict';

    let map = null;
    let userMarker = null;
    let placementEnabled = false;
    let currentLat = 0;
    let currentLon = 0;
    const waypointMarkers = new Map();

    function bridge(name, ...args) {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge[name] === 'function') {
          window.AndroidBridge[name](...args);
        }
      } catch (_) {}
    }

    function createUserMarker() {
      const el = document.createElement('div');
      el.className = 'user-marker';
      return new maplibregl.Marker({ element: el, anchor: 'center' });
    }

    function symbolFor(type) {
      switch (type) {
        case 'CAR': return '🚗';
        case 'MUSHROOM': return '🍄';
        case 'WATER': return '💧';
        case 'DANGER': return '⚠';
        case 'FAVORITE': return '★';
        default: return '📍';
      }
    }

    function makeWaypointElement(item) {
      const el = document.createElement('div');
      el.className = 'waypoint-marker';
      el.textContent = symbolFor(item.type);
      el.title = item.name || '';
      el.addEventListener('click', (event) => {
        event.stopPropagation();
        bridge('onWaypointClick', String(item.id));
      });
      return el;
    }

    function reportScale() {
      if (!map) return;
      const center = map.getCenter();
      const zoom = map.getZoom();
      const metersPerPixel =
        156543.03392 * Math.cos(center.lat * Math.PI / 180) / Math.pow(2, zoom);
      const referencePixels = Math.min(window.innerWidth * 0.32, 160);
      const meters = Math.max(0.1, metersPerPixel * referencePixels);
      bridge('onScaleChanged', meters);
    }

    window.initMap = function(lat, lon, bearing) {
      currentLat = Number(lat);
      currentLon = Number(lon);

      if (map) {
        window.updateLocation(lat, lon);
        return;
      }

      map = new maplibregl.Map({
        container: 'map',
        style: '/style/3d.json',
        center: [currentLon, currentLat],
        zoom: 15.5,
        pitch: 68,
        bearing: Number.isFinite(Number(bearing)) ? Number(bearing) : 0,
        minPitch: 0,
        maxPitch: 85,
        attributionControl: true,
        antialias: true,
        fadeDuration: 0
      });

      try {
        map.touchZoomRotate.enable();
        if (typeof map.touchZoomRotate.enableRotation === 'function') {
          map.touchZoomRotate.enableRotation();
        }
        if (map.touchPitch && typeof map.touchPitch.enable === 'function') {
          map.touchPitch.enable();
        }
        if (map.dragRotate && typeof map.dragRotate.enable === 'function') {
          map.dragRotate.enable();
        }
      } catch (_) {}

      map.on('load', () => {
        userMarker = createUserMarker()
          .setLngLat([currentLon, currentLat])
          .addTo(map);
        reportScale();
        bridge('onMapReady');
      });

      map.on('click', (e) => {
        if (placementEnabled) {
          bridge('onMapClick', e.lngLat.lat, e.lngLat.lng);
        }
      });

      map.on('contextmenu', (e) => {
        bridge('onMapLongPress', e.lngLat.lat, e.lngLat.lng);
      });

      let scaleTimer = null;
      const scheduleScale = () => {
        if (scaleTimer) return;
        scaleTimer = setTimeout(() => {
          scaleTimer = null;
          reportScale();
        }, 120);
      };

      map.on('zoom', scheduleScale);
      map.on('move', scheduleScale);
      map.on('pitch', scheduleScale);
    };

    window.updateLocation = function(lat, lon) {
      currentLat = Number(lat);
      currentLon = Number(lon);
      if (userMarker) {
        userMarker.setLngLat([currentLon, currentLat]);
      }
    };

    window.recenter = function(lat, lon, bearing) {
      currentLat = Number(lat);
      currentLon = Number(lon);
      if (!map) return;

      const options = {
        center: [currentLon, currentLat],
        zoom: Math.max(map.getZoom(), 16.0),
        pitch: map.getPitch(),
        duration: 500
      };
      if (Number.isFinite(Number(bearing))) {
        options.bearing = Number(bearing);
      }
      map.easeTo(options);
    };

    window.setPitch = function(pitch) {
      if (!map) return;
      map.easeTo({
        pitch: Math.max(0, Math.min(85, Number(pitch))),
        zoom: Math.max(map.getZoom(), Number(pitch) >= 70 ? 16.8 : map.getZoom()),
        duration: 420
      });
    };

    window.setPlacementEnabled = function(enabled) {
      placementEnabled = !!enabled;
    };

    window.updateWaypoints = function(items) {
      if (!Array.isArray(items) || !map) return;

      const keep = new Set();
      for (const item of items) {
        const id = String(item.id);
        keep.add(id);

        let marker = waypointMarkers.get(id);
        if (!marker) {
          marker = new maplibregl.Marker({
            element: makeWaypointElement(item),
            anchor: 'bottom'
          })
          .setLngLat([Number(item.lon), Number(item.lat)])
          .addTo(map);
          waypointMarkers.set(id, marker);
        } else {
          marker.setLngLat([Number(item.lon), Number(item.lat)]);
        }
      }

      for (const [id, marker] of waypointMarkers.entries()) {
        if (!keep.has(id)) {
          marker.remove();
          waypointMarkers.delete(id);
        }
      }
    };

    window.addEventListener('resize', () => {
      if (map) {
        map.resize();
        reportScale();
      }
    });
  </script>
</body>
</html>
