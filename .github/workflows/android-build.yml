name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORESTNAV_KEYSTORE_B64: ${{ secrets.FORESTNAV_KEYSTORE_B64 }}
      FORESTNAV_STORE_PASSWORD: ${{ secrets.FORESTNAV_STORE_PASSWORD }}
      FORESTNAV_KEY_ALIAS: ${{ secrets.FORESTNAV_KEY_ALIAS }}
      FORESTNAV_KEY_PASSWORD: ${{ secrets.FORESTNAV_KEY_PASSWORD }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle MapLibre GL JS 6.11.1
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://unpkg.com/maplibre-gl@6.11.1/dist/maplibre-gl.js" \
            --output app/src/main/assets/maplibre-gl.js
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://unpkg.com/maplibre-gl@6.11.1/dist/maplibre-gl.css" \
            --output app/src/main/assets/maplibre-gl.css
          test -s app/src/main/assets/maplibre-gl.js
          test -s app/src/main/assets/maplibre-gl.css

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare stable signing key
        if: ${{ env.FORESTNAV_KEYSTORE_B64 != '' }}
        run: |
          echo "$FORESTNAV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/forestnav-release.jks"

      - name: Build signed updateable APK
        if: ${{ env.FORESTNAV_KEYSTORE_B64 != '' }}
        env:
          FORESTNAV_KEYSTORE_PATH: ${{ runner.temp }}/forestnav-release.jks
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Build debug APK
        if: ${{ env.FORESTNAV_KEYSTORE_B64 == '' }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForestNavigator-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
