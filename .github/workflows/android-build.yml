name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORESTNAV_KEYSTORE_B64: ${{ secrets.FORESTNAV_KEYSTORE_B64 }}
      FORESTNAV_STORE_PASSWORD: ${{ secrets.FORESTNAV_STORE_PASSWORD }}
      FORESTNAV_KEY_ALIAS: ${{ secrets.FORESTNAV_KEY_ALIAS }}
      FORESTNAV_KEY_PASSWORD: ${{ secrets.FORESTNAV_KEY_PASSWORD }}
      ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare stable signing key
        if: ${{ env.FORESTNAV_KEYSTORE_B64 != '' }}
        run: |
          echo "$FORESTNAV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/forestnav-release.jks"

      - name: Recover bundled ArcGIS API key
        if: ${{ env.ARCGIS_API_KEY == '' && env.FORESTNAV_KEYSTORE_B64 != '' }}
        run: |
          TEMP_PASS="forestnav-ci-wrap"
          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/forestnav-release.jks" \
            -srcstorepass "$FORESTNAV_STORE_PASSWORD" \
            -srcalias "$FORESTNAV_KEY_ALIAS" \
            -srckeypass "$FORESTNAV_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/forestnav-signing.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$TEMP_PASS" \
            -destkeypass "$TEMP_PASS" \
            -noprompt
          openssl pkcs12 \
            -in "$RUNNER_TEMP/forestnav-signing.p12" \
            -nocerts -nodes \
            -passin "pass:$TEMP_PASS" \
            -out "$RUNNER_TEMP/forestnav-private.pem"
          base64 --decode ".github/secure/arcgis_api_key.rsa.b64" > "$RUNNER_TEMP/arcgis-key.rsa"
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/forestnav-private.pem" \
            -in "$RUNNER_TEMP/arcgis-key.rsa" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out "$RUNNER_TEMP/arcgis-key.txt"
          ARCGIS_KEY="$(tr -d '\r\n' < "$RUNNER_TEMP/arcgis-key.txt")"
          test -n "$ARCGIS_KEY"
          echo "::add-mask::$ARCGIS_KEY"
          echo "ARCGIS_API_KEY=$ARCGIS_KEY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/forestnav-signing.p12" \
            "$RUNNER_TEMP/forestnav-private.pem" \
            "$RUNNER_TEMP/arcgis-key.rsa" \
            "$RUNNER_TEMP/arcgis-key.txt"

      - name: Validate Open Basemap styles
        run: |
          set -euo pipefail
          for STYLE in osm-style hybrid; do
            URL="https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/open/$STYLE?f=json&language=ru"
            CODE="$(curl --silent --show-error --location --output "$RUNNER_TEMP/$STYLE.json" --write-out "%{http_code}" \
              -H "Authorization: Bearer $ARCGIS_API_KEY" "$URL")"
            test "$CODE" = "200"
            grep -q '"version"[[:space:]]*:[[:space:]]*8' "$RUNNER_TEMP/$STYLE.json"
            rm -f "$RUNNER_TEMP/$STYLE.json"
          done

      - name: Validate map tile sources
        run: |
          set -euo pipefail

          for STYLE in "open/osm-style" "open/hybrid/detail"; do
            URL="https://static-map-tiles-api.arcgis.com/arcgis/rest/services/static-basemap-tiles-service/v1/$STYLE/static/tile/0/0/0?token=$ARCGIS_API_KEY"
            CODE="$(curl --silent --show-error --location --output "$RUNNER_TEMP/static-tile.png" --write-out "%{http_code}" "$URL")"
            test "$CODE" = "200"
            test "$(xxd -p -l 8 "$RUNNER_TEMP/static-tile.png")" = "89504e470d0a1a0a"
          done

          IMAGERY_URL="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/0/0/0"
          CODE="$(curl --silent --show-error --location --output "$RUNNER_TEMP/imagery-tile" --write-out "%{http_code}" "$IMAGERY_URL")"
          test "$CODE" = "200"
          test "$(wc -c < "$RUNNER_TEMP/imagery-tile")" -gt 500

          rm -f "$RUNNER_TEMP/static-tile.png" "$RUNNER_TEMP/imagery-tile"

      - name: Build signed updateable APK
        if: ${{ env.FORESTNAV_KEYSTORE_B64 != '' }}
        env:
          FORESTNAV_KEYSTORE_PATH: ${{ runner.temp }}/forestnav-release.jks
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Build debug APK
        if: ${{ env.FORESTNAV_KEYSTORE_B64 == '' }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForestNavigator-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publish direct APK download
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish ForestNavigator 1.6.0 APK' && env.FORESTNAV_KEYSTORE_B64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/ForestNavigator-1.6.0.apk"
          gh release create "v1.6.0"             "$RUNNER_TEMP/ForestNavigator-1.6.0.apk#ForestNavigator-1.6.0.apk"             --target "$GITHUB_SHA"             --title "ForestNavigator 1.6.0"             --notes "Open OSM Style + Open Hybrid static tiles, direct MapLibre offline downloads, relief modes removed."
